<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>珠海海拔记录员 · 正数和负数</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
      font-size: 18px;
      line-height: 1.5;
      color: #1d2430;
      background: #efeae1;
      overflow: hidden;
    }
    button { font: inherit; color: inherit; }
    .shell {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;

    header {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      gap: 8px;
      min-height: 56px;
      padding: 8px 12px;
      padding-top: calc(8px + env(safe-area-inset-top));
      background: #155e75;
      color: #fff;
    }
    header .tap { background: transparent; color: #fff; border-color: rgba(255,255,255,.75); }
    .titles { flex: 1; min-width: 0; }
    .eyebrow { margin: 0; font-size: 12px; opacity: .9; }
    h1 { margin: 0; font-size: 20px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    #sound-btn { font-size: 15px; padding: 8px; white-space: nowrap; }
    main { flex: 1; min-height: 0; overflow: auto; padding: 8px 12px 16px; }
    .tap {
      min-height: 48px;
      min-width: 48px;
      padding: 8px 12px;
      border: 1px solid #d9d0c0;
      border-radius: 12px;
      background: #fffdf8;
    }
    .tap:disabled, .is-disabled { background: #ececec; color: #8a8a8a; }
    .primary { background: #155e75; color: #fff; border-color: #155e75; }
    .stack { display: flex; flex-direction: column; gap: 8px; }
    .stem { font-size: 20px; line-height: 1.45; margin: 0; }
    .stem-block { margin: 0 0 8px; }
    .example-tag { display: block; text-align: right; font-size: 12px; color: #6b6b6b; line-height: 1.3; margin-top: 4px; }
    .help, .narration, .rule { margin: 0 0 8px; }
    .narration, .rule {
      background: #e7f2f4;
      border-radius: 12px;
      padding: 8px 10px;
    }
    .num-pos { color: #1f5fbf; }
    .num-neg { color: #b3261e; }
    .num-zero { color: #444; }
    .entry, .readout {
      min-height: 48px;
      margin: 0;
      font-size: 32px;
      font-weight: 700;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .readout { margin: 8px 0; }
    .notebook { display: flex; flex-direction: column; gap: 8px; }
    .note-card, .info, .panel, .merged, .hint {
      background: #fffdf8;
      border: 1px solid #e4d8c4;
      border-radius: 14px;
      padding: 10px 12px;
    }
    .note-card.is-active { outline: 3px solid #155e75; }
    .note-card p { margin: 0; }
    .note-card .kicker { margin: 0 0 4px; }
    .info p { margin: 0 0 8px; }
    .kicker { margin: 0 0 4px; color: #155e75; font-size: 14px; }
    .coast { width: 100%; height: 104px; display: block; margin: 0 0 8px; }
    .tide .coast { height: 88px; margin: 0; }
    .fit-step { display: flex; flex-direction: column; gap: 8px; }
    .fit-side { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .fit-side > .narration,
    .fit-side > .rule,
    .fit-side > .coast,
    .fit-side > .tide,
    .fit-side > .notebook,
    .fit-side > .stem,
    .fit-side > .stem-block { margin: 0; }
    .entry-row { display: flex; flex-direction: column; gap: 8px; }
    .prescribe {
      background: #fffdf8;
      border: 1px solid #e4d8c4;
      border-radius: 14px;
      padding: 8px 10px 10px;
    }
    .stack + .tap,
    .tray + .tap,
    .judge-row + .tap,
    .panel + .tap,
    .after-gap { margin-top: 8px; }
    .tray { margin-top: 8px; }
    .captions { min-height: 72px; }
    .captions p { margin: 0 0 4px; font-size: 20px; }
    .numpad { display: flex; flex-direction: column; gap: 8px; }
    .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .sign-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .wide { width: 100%; }
    .option { width: 100%; text-align: left; }
    .judge-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .match { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .col, .tray, .buckets, .merged-list { display: flex; flex-direction: column; gap: 8px; }
    .tray { flex-direction: row; flex-wrap: wrap; }
    .card, .num-card, .order-card, .icon-btn, .ruler-track { touch-action: none; user-select: none; }
    .card, .order-card { width: 100%; text-align: left; }
    .num-card { font-size: 20px; font-weight: 700; }
    .is-selected { outline: 3px solid #155e75; }
    .merged { background: #e7f5ea; }
    .hint { background: #fff1e0; }
    .buckets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .bucket { min-height: 96px; text-align: center; }
    .bname { display: block; font-weight: 700; }
    .chip { display: inline-block; margin: 2px; font-weight: 700; }
    .easter { margin: 8px 0 0; font-size: 14px; color: #3d4a55; }
    .tide { margin-bottom: 8px; display: flex; flex-direction: column; gap: 8px; }
    .switch { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .seg { display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 12px; background: #fffdf8; border: 1px solid #d9d0c0; text-align: center; padding: 8px; }
    .seg.on { outline: 3px solid #155e75; font-weight: 700; }
    .baseline { margin: 8px 0 0; color: #444; }
    .ruler-box {
      display: grid;
      grid-template-columns: 124px 48px 168px;
      justify-content: center;
      gap: 8px;
      height: min(480px, max(220px, calc(100dvh - 380px)));
      margin: 8px auto;
      max-width: 100%;
    }
    .ruler-labels, .ruler-track, .icon-col { position: relative; min-width: 0; min-height: 0; height: 100%; }
    .ruler-track { background: #f7f4ee; border-radius: 10px; }
    .icon-col { display: flex; flex-direction: column; gap: 8px; overflow: auto; }
    .tick { position: absolute; right: 0; width: 10px; height: 1px; background: #8a8175; }
    .tick.major { width: 18px; height: 2px; background: #444; }
    .sea-line { position: absolute; left: 0; right: 0; height: 4px; background: #444; transform: translateY(-50%); }
    .rlab { position: absolute; right: 0; transform: translateY(-50%); font-size: 14px; white-space: nowrap; }
    .mark { position: absolute; left: 50%; transform: translate(-50%, -50%); pointer-events: none; font-size: 18px; }
    .icon-btn { width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .icon-btn:disabled { opacity: .45; }
    .icon-btn.is-current { outline: 3px solid #155e75; }
    .level-btn, .review-btn { width: 100%; display: flex; align-items: center; gap: 8px; text-align: left; }
    .level-btn .nm, .review-btn span.name { flex: 1; }
    .stars { color: #8a5a12; letter-spacing: 1px; }
    .review-btn { position: relative; }
    .due-dot { width: 10px; height: 10px; border-radius: 50%; background: #c62828; display: inline-block; }
    .score { font-size: 32px; font-weight: 700; margin: 8px 0; }
    .panel { margin-top: 12px; padding: 0; }
    .panel summary { padding: 12px; cursor: pointer; }
    .panel .inner { padding: 0 12px 12px; }
    .panel p, .panel li { margin: 0 0 8px; }
    #feedback { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; }
    #feedback .panel { width: min(720px, 100%); margin: 0; border-radius: 16px 16px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); max-height: 46vh; overflow: auto; animation: slideup .28s ease; }
    #feedback.ok .panel { background: #e7f5ea; }
    #feedback.bad .panel { background: #fff1e0; }
    #modal { position: fixed; inset: 0; z-index: 30; background: rgba(20,16,10,.45); display: flex; align-items: center; justify-content: center; padding: 16px; }
    .dialog { width: min(440px, 100%); background: #fffdf8; border-radius: 16px; padding: 16px; }
    .dialog .row { display: flex; gap: 8px; }
    .dialog .row .tap { flex: 1; }
    .foot { margin-top: 16px; color: #5c6570; font-size: 14px; }
    :focus-visible { outline: 3px solid #155e75; outline-offset: 2px; }
    @keyframes keyblink {
      0%, 100% { box-shadow: none; }
      50% { box-shadow: 0 0 0 3px #1f5fbf; }
    }
    @keyframes slideup {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    @keyframes pairflash {
      from { background: #9ed9ad; }
      to { background: #e7f5ea; }
    }
    .blink { animation: keyblink .45s linear 2; }
    .merged.flash { animation: pairflash .45s ease; }
    @media (prefers-reduced-motion: reduce) {
      .blink, #feedback .panel, .merged.flash { animation: none; }
    }
    @media (min-height: 1000px) {
      .coast { height: 168px; }
      .tide .coast { height: 120px; }
    }
    @media (max-height: 520px) {
      header { min-height: 48px; padding: 0 8px; }
      main { padding: 8px 8px 0; }
      .fit-step {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 8px;
        align-items: start;
      }
      .coast { height: 72px; }
      .tide .coast { height: 64px; }
      .entry-row { flex-direction: row; align-items: stretch; }
      .entry-row .entry { flex: 1; min-width: 0; }
      .entry-row .sign-row { width: auto; grid-template-columns: 48px 48px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <button type="button" class="tap" id="nav-btn" data-action="home" aria-label="回到关卡地图">地图</button>

        <p class="eyebrow" id="eyebrow"></p>
        <h1 id="title"></h1>
      </div>
      <span id="starbar"></span>
      <button type="button" class="tap" id="sound-btn" data-action="sound" aria-pressed="false" aria-label="音效：关">音效：关</button>
    </header>
    <main id="main"></main>
  </div>
  <div id="feedback" hidden role="region" aria-label="反馈">
    <div class="panel">
      <p id="feedback-text"></p>
      <button type="button" class="tap primary" id="feedback-next" data-action="feedback-next"></button>
    </div>
  </div>
  <div id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="dialog">
      <h2 id="modal-title"></h2>
      <p id="modal-body"></p>
      <div class="row">
        <button type="button" class="tap" id="modal-cancel" data-action="modal-cancel">取消</button>
        <button type="button" class="tap primary" id="modal-ok" data-action="modal-ok">确定</button>
      </div>
    </div>
  </div>
  <script>
    const KEY = "zh-math7a-1-1";
    const M = "−";
    const LESSON = {
      id: "zh-math7a-1-1",
      title: "珠海海拔记录员",
      book: "人教版七上 1.1 正数和负数",
      meta: {
        story: "孩子是「珠海海拔记录员」，要帮无人机「小珠」建一份珠海高度地图。小珠只认记录本上的数字，记录本写成什么，它就飞到哪里。第一关就会出错：小珠把海底隧道当成了半山腰。孩子得发明一种记法，让小珠不再飞错。",
        duration: "约 30–35 分钟（第 0–4 关约 22 分钟，小测约 8 分钟，第 5 关加分关可选 3 分钟）。可以分两次玩，进度自动保存。",
        prepare: "只需要一台 iPad 或手机浏览器，不需要教具、纸笔和网络（首次加载后可离线）。",
        goals: [
          "说出为什么需要负数：只有正数时，「高 46 米」和「低 46 米」写出来都是 46，分不清。",
          "从生活里找出成对的相反意义的量，并判断两个量是不是相反意义。",
          "正确写、读、分类正数和负数（包括小数、分数），知道 0 既不是正数也不是负数。",
          "遇到实际问题，先说清「0 代表什么、哪边算正」，再用正负数记录。",
          "明白正方向可以自己规定：规定反过来，符号跟着反过来，但描述的事实不变。",
          "（选学）看懂「20±0.2 mm」这类允许偏差。"
        ],
        startTitle: "在家怎么开始（给家长）：",
        start: [
          "不要先讲「负数」两个字。打开前只问一句：「你知道板樟山多高吗？港珠澳大桥的海底隧道呢？」",
          "把平板交给孩子，家长坐在旁边。孩子卡住时，只问「你觉得问题出在哪？」，不直接给答案。",
          "玩完后，请孩子用一句话向家长「教」一遍：为什么要有负数。这是自我解释，比家长讲一遍更有效。",
          "间隔复习：第 2 天和第 7 天各打开一次「复习」按钮（3 道随机题，见 §7），每次约 2 分钟。"
        ],
        tipsLead: "等孩子能用自己的话讲清「为什么需要负数」后再看。平时不占用兴趣时间。",
        tips: [
          "「如果……记作 +a，那么……记作？」这是最常见的题型。先找题目里的「规定」，再判断方向是否相反。",
          "「下列各数中，正数有几个、负数有几个」常见陷阱：0 不算正数也不算负数；省略「+」的数也是正数；带「−」的分数、小数也是负数。",
          "「标准质量 ±」类来自课本「阅读与思考」的允许偏差，考查读懂「±」的范围。",
          "相反意义的量判断题先看是否同一类，再看方向是否相反，数值不必相等。",
          "超出本节的内容：比如「−(−3) 是正数还是负数」「|−5|」，属于后面的相反数、绝对值，这一课不练。"
        ],
        endings: {
          high: "记录员认证通过！你已经能给小珠写清楚任何高度了。",
          mid: "快通过了！点下面的关卡回看一下，再来一次。",
          low: "没关系，先回第 0 关看小珠为什么飞错，再慢慢来。"
        },
        starRule: "一次答对 ★，重试后答对 ☆（空心）。星星只显示，不排名、不限时。"
      },
      levels: [
        {
          id: "L0", title: "小珠飞错了", kp: ["K1"],
          steps: [
            {
              id: "L0-a", type: "numpad", scored: true, allowSign: false, scene: "start",
              narration: "我是无人机小珠！请把这两个地点的高度写进记录本，我照着飞。",
              cards: [
                { label: "卡片 A", text: "板樟山山顶：比海平面高 274 米", bold: ["高"], active: true },
                { label: "卡片 B", text: "港珠澳大桥海底隧道最深处：比海平面低 46 米", bold: ["低"], active: false }
              ],
              answer: "274",
              wrong: "再看看卡片 A 写的是多少米"
            },
            {
              id: "L0-b", type: "numpad", scored: true, allowSign: false, scene: "start",
              cards: [
                { label: "卡片 A", text: "板樟山山顶：比海平面高 274 米", bold: ["高"], active: false },
                { label: "卡片 B", text: "港珠澳大桥海底隧道最深处：比海平面低 46 米", bold: ["低"], active: true }
              ],
              answer: "46",
              wrong: "再看看卡片 B 写的是多少米"
            },
            { id: "L0-anim", type: "animation", name: "droneWrong" },
            {
              id: "L0-why", type: "single", scored: true, scene: "lost",
              prompt: "小珠为什么飞错了？",
              options: [
                "A. 小珠的电池没电了",
                "B. 记录本上「高 46 米」和「低 46 米」都写成 46，小珠分不出来",
                "C. 46 这个数字算错了",
                "D. 隧道不在海平面以下"
              ],
              correct: 1,
              feedback: {
                correct: "对！数字只说了「多远」，没说「往哪边」。记录员需要一种记号，把「高于」和「低于」分开。",
                wrong: {
                  0: "小珠第一次飞到山顶时电池好好的。看看它在第二个地点时，是往哪个方向飞的？",
                  2: "46 米这个数字本身没错，卡片 B 写的就是 46 米。问题出在别的地方：它往哪边飞了？",
                  3: "卡片 B 写的是比海平面「低」46 米。那小珠为什么往上飞？"
                }
              }
            },
            {
              id: "L0-invent", type: "single", scored: true, scene: "lost",
              prompt: "你来当发明家：怎么改记录本，小珠就不会飞错？",
              options: [
                "A. 在高于海平面的数前加「+」，低于海平面的数前加「−」",
                "B. 低于海平面的数用红笔写",
                "C. 低于海平面的数旁边写「下」字",
                "D. 以上都能帮人看懂，但小珠只读数字符号，最好选一种简单统一的记号"
              ],
              correct: [3, 0],
              feedback: {
                correct: {
                  3: "说得好！B、C 也能让人看懂，但颜色和汉字要另作约定。数学家选了最简单的办法：在数前面加「+」或「−」。",
                  0: "这正是数学家的办法！其实 B、C 也能让人看懂，但「+」「−」最简洁、最通用。"
                },
                wrong: {
                  1: "这个办法人能看懂。不过小珠只读数字和符号，不认颜色和汉字，有没有更通用的记法？",
                  2: "这个办法人能看懂。不过小珠只读数字和符号，不认颜色和汉字，有没有更通用的记法？"
                }
              }
            },
            {
              id: "L0-b2", type: "numpad", scored: true, allowSign: true, signBlink: true, scene: "lost",
              narration: "试试新键！重新记录卡片 B。",
              cards: [
                { label: "卡片 B", text: "港珠澳大桥海底隧道最深处：比海平面低 46 米", bold: ["低"], active: true }
              ],
              answer: "−46",
              wrongExact: { "46": "卡片 B 是比海平面『低』，你按的是哪个符号？" },
              wrong: "再看看卡片 B 写的是多少米",
              feedback: { correct: "找到了！" }
            },
            {
              id: "L0-def", type: "info", scene: "tunnel", button: "我记住了",
              body: [
                { text: "像 274、46 这样大于 0 的数叫正数（也可以写成 +274，读作「正二百七十四」）。", bold: ["正数"] },
                { text: "在正数前面加上「−」的数，比如 −46，叫负数，读作「负四十六」。", bold: ["负数"] },
                { text: "在这张图里，0 就是海平面：比它高记正，比它低记负。", bold: ["0 就是海平面"] },
                { text: "（课本里的准确说法，请以学校发的书为准。）", bold: [] }
              ]
            }
          ]
        },
        {
          id: "L1", title: "找反义搭档", kp: ["K2"],
          steps: [
            {
              id: "L1-match", type: "dragMatch", scored: true, example: true,
              help: "把每张左卡拖到意义相反的右卡上。也可以先点左边的卡片，再点右边的卡片。",
              wrong: "这两张说的是同一类事吗？先找同一类，再看方向是不是相反。",
              pairs: [
                { id: "money", left: "收入 200 元", right: "支出 80 元", example: true },
                { id: "temp", left: "气温零上 15 ℃", right: "气温零下 3 ℃", example: true },
                { id: "alt", left: "比海平面高 274 米", right: "比海平面低 46 米", example: false },
                { id: "east", left: "向东走 300 米", right: "向西走 120 米", example: true },
                { id: "water", left: "水位上涨 0.5 米", right: "水位下降 0.3 米", example: true },
                { id: "shop", left: "小店盈利 1000 元", right: "小店亏损 600 元", example: true }
              ]
            },

        if (!AC) return;
        if (!audioCtx) audioCtx = new AC();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const t = audioCtx.currentTime;
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = "sine";
        o.frequency.setValueAtTime(784, t);
        o.frequency.exponentialRampToValueAtTime(1175, t + 0.09);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.12, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);

        if (reduce || ms <= 0) {
          drone.setAttribute("transform", "translate(" + to[0] + "," + to[1] + ")");
          ui.dronePos = to.slice();
          return;
        }
        const from = ui.dronePos || DRONE.start;
        const t0 = performance.now();
        function frame(now) {
          if (my !== flyToken || animGeneration !== token) return;
          const t = Math.min(1, (now - t0) / ms);
          const e = 1 - Math.pow(1 - t, 2);
          const x = from[0] + (to[0] - from[0]) * e;
          const y = from[1] + (to[1] - from[1]) * e;
          const node = document.getElementById("drone");
          if (node) node.setAttribute("transform", "translate(" + x + "," + y + ")");
          if (t < 1) requestAnimationFrame(frame);
          else ui.dronePos = to.slice();
        }
        requestAnimationFrame(frame);
      }
      setTimeout(() => {
        if (animGeneration !== token) return;
        fly("summit", 900);
        const cap = document.getElementById("caption");
        if (cap) cap.textContent = "到了！✓";
      }, 400);
      setTimeout(() => {
        if (animGeneration !== token) return;
        fly("lost", 1100);
        const cap2 = document.getElementById("caption2");
        if (cap2) cap2.textContent = "隧道在哪？这里只有树……";
        const face = document.getElementById("face");
        if (face) face.setAttribute("visibility", "visible");
      }, 1600);
      setTimeout(() => {
        if (animGeneration !== token) return;
        const btn = document.getElementById("step-next");
        if (btn) btn.hidden = false;
      }, 3000);
    }
    document.addEventListener("click", (e) => {
      const keyBtn = e.target.closest("[data-key]");
      if (keyBtn) {
        if (feedbackOpen || !document.getElementById("modal").hidden) return;
        pressKey(keyBtn.dataset.key);
        return;
      }
      const btn = e.target.closest("[data-action]");
      if (!btn || btn.disabled) return;
      handleAction(btn.dataset.action, btn);
    });
    document.addEventListener("pointerdown", onPointerDown, { passive: false });
    document.addEventListener("pointermove", onPointerMove, { passive: false });
    document.addEventListener("pointerup", onPointerUp);
    document.addEventListener("pointercancel", () => { gesture = null; });
    document.addEventListener("keydown", onKeyDown);
    window.__ZH__ = { LESSON: LESSON, normalizeAnswer: normalizeAnswer, gradeInput: gradeInput, pickReview: pickReview, todayStr: todayStr, soundPlays: () => soundPlays };
    render();
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        const url = new URL("../sw.js", location.href);
        navigator.serviceWorker.register(url.href).catch(() => {});
      });
    }
  </script>
